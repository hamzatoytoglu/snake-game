<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Jeu du Serpent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <h1>🐍 Jeu du Serpent</h1>

    <div class="hud">
      <div class="hud-item">Score : <span id="score">0</span></div>
      <div class="hud-item">Record : <span id="highscore">0</span></div>
      <div class="hud-item">Niveau : <span id="level">1</span></div>
    </div>

    <div class="canvas-container">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Prêt à jouer ?</h2>
        <p id="overlay-text">Utilise les flèches du clavier ou ZQSD pour diriger le serpent.<br>Sur mobile, glisse ton doigt sur l'écran.</p>
        <button id="start-btn">Jouer</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn" data-dir="up">▲</button>
      <div class="controls-row">
        <button class="btn" data-dir="left">◀</button>
        <button class="btn" data-dir="down">▼</button>
        <button class="btn" data-dir="right">▶</button>
      </div>
    </div>

    <p class="hint">Espace ou P : pause &nbsp;|&nbsp; R : recommencer</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
